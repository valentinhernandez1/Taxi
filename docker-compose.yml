# Postgres local para desarrollo. Misma versión mayor que Neon (16).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taxis
      POSTGRES_PASSWORD: taxis
      POSTGRES_DB: taxis
      TZ: America/Montevideo
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxis -d taxis"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  datos:
