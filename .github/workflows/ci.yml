name: CI

on:
  push:
  pull_request:
  # Para desplegar a mano (Actions → CI → Run workflow, rama main), por ejemplo
  # después de cargar los secrets de producción.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxis
          POSTGRES_PASSWORD: taxis
          POSTGRES_DB: taxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxis -d taxis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://taxis:taxis@localhost:5432/taxis_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Pruebas (reglas de dinero, API en workerd contra Postgres)
        run: pnpm test
      - name: Build de la web (PWA)
        run: pnpm --filter @taxis/web build
      - name: Build del Worker (sin desplegar)
        run: pnpm --filter @taxis/api build

  copia:
    name: Copia y restauración
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxis
          POSTGRES_PASSWORD: taxis
          POSTGRES_DB: taxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxis -d taxis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar age y cliente de Postgres 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Copia cifrada → restauración en base vacía → comparación
        env:
          ADMIN_URL: postgres://taxis:taxis@localhost:5432/postgres
        run: scripts/probar-copia.sh

  desplegar:
    name: Desplegar a producción
    # Solo en main, y solo si pasaron todas las pruebas y la prueba de copia.
    needs: [verificar, copia]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # En Settings → Environments → produccion se puede exigir aprobación antes de desplegar.
    environment: produccion
    concurrency:
      group: desplegar
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCCION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VAPID_PUBLICA: ${{ secrets.VAPID_PUBLICA }}
      VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
      VAPID_CONTACTO: ${{ secrets.VAPID_CONTACTO }}
    steps:
      - name: ¿Está configurado?
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Faltan secrets de producción (ver docs/despliegue.md); no se despliega."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.listo == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.listo == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.listo == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.listo == 'true'
        run: pnpm install --frozen-lockfile
      # Primero la base: las migraciones son solo de agregar (nada destructivo, CLAUDE.md),
      # así la versión anterior del Worker sigue andando mientras se despliega la nueva.
      - name: Migraciones en Neon
        if: steps.config.outputs.listo == 'true'
        run: pnpm db:migrate
      - name: Bucket de fotos de comprobantes (R2)
        if: steps.config.outputs.listo == 'true'
        working-directory: apps/api
        run: |
          if pnpm exec wrangler r2 bucket info taxis-comprobantes >/dev/null 2>&1; then
            echo "El bucket taxis-comprobantes ya existe."
          elif pnpm exec wrangler r2 bucket create taxis-comprobantes --location enam; then
            echo "Bucket taxis-comprobantes creado."
          else
            echo "::error::No se pudo crear el bucket de R2. Activá R2 en el panel de Cloudflare y revisá que el token tenga 'Workers R2 Storage: Edit' (docs/despliegue.md)."
            exit 1
          fi
      - name: Build de la web
        if: steps.config.outputs.listo == 'true'
        run: pnpm --filter @taxis/web build
      - name: Desplegar el Worker (web + API)
        if: steps.config.outputs.listo == 'true'
        id: desplegar
        working-directory: apps/api
        run: |
          set -euo pipefail
          secretos="$RUNNER_TEMP/secretos.json"
          # Las claves de los avisos al celular son opcionales: si no están, los avisos quedan apagados.
          node -e '
            const s = { DATABASE_URL: process.env.DATABASE_URL };
            for (const k of ["VAPID_PUBLICA", "VAPID_PRIVADA", "VAPID_CONTACTO"]) if (process.env[k]) s[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(s));
          ' "$secretos"
          pnpm exec wrangler deploy -c wrangler.produccion.jsonc --secrets-file "$secretos" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$secretos"
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          echo "url=${url:-${{ vars.URL_PRODUCCION }}}" >> "$GITHUB_OUTPUT"
      - name: Comprobar que responde y llega a la base
        if: steps.config.outputs.listo == 'true' && steps.desplegar.outputs.url != ''
        env:
          URL: ${{ steps.desplegar.outputs.url }}
        run: |
          set -euo pipefail
          # La primera vez, la dirección *.workers.dev tarda unos segundos en
          # propagarse (da 404): se reintenta hasta ~1 minuto antes de fallar.
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$URL/api/salud"
          # Un login con un email que no existe tiene que dar 401: prueba que el Worker
          # se conecta a Neon (TLS incluido). Cualquier otra cosa es un problema.
          estado="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/auth/login" \
            -H 'content-type: application/json' \
            -d '{"email":"comprobacion-despliegue@ejemplo.invalid","password":"x"}')"
          echo "login de prueba: $estado"
          test "$estado" = "401"
          curl -fsS -o /dev/null "$URL/"
          echo "Publicado en $URL"
