name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxis
          POSTGRES_PASSWORD: taxis
          POSTGRES_DB: taxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxis -d taxis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://taxis:taxis@localhost:5432/taxis_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Pruebas (reglas de dinero, API en workerd contra Postgres)
        run: pnpm test
      - name: Build de la web (PWA)
        run: pnpm --filter @taxis/web build
      - name: Build del Worker (sin desplegar)
        run: pnpm --filter @taxis/api build

  copia:
    name: Copia y restauración
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxis
          POSTGRES_PASSWORD: taxis
          POSTGRES_DB: taxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxis -d taxis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar age y cliente de Postgres 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Copia cifrada → restauración en base vacía → comparación
        env:
          ADMIN_URL: postgres://taxis:taxis@localhost:5432/postgres
        run: scripts/probar-copia.sh
